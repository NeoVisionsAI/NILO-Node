[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nilo-node"
version = "0.1.0"
description = "NILO-Node edge data collection platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",
    "python-ulid>=2.7.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "numpy>=1.26.0",
    "aiomqtt>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
camera = [
    "depthai>=2.24.0",
    "mediapipe>=0.10.0",
    "opencv-python-headless>=4.8.0",
]
hardware = [
    "depthai>=2.24.0",
    "mediapipe>=0.10.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "ultralytics>=8.3.0",
    "blobconverter>=1.4.0",
]

[project.scripts]
nilo-node = "nilo_node.main:main"
nilo-node-cli = "nilo_node.cli:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nilo_node.web" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
